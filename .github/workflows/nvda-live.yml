name: NVDA live fill test

# Real NVDA + real browser on a real Windows runner. This is the test the
# sandbox and Wine cannot do: it proves the add-on actually reads a live field,
# pastes into the real DOM, and announces correctly. It runs on the current
# NVDA that guidepup installs, so it also covers the newer-NVDA question.
#
# Manual for now (workflow_dispatch). A nightly schedule can be added later.
# Not a pull-request gate: it is slow and breaks when NVDA rephrases things.

on:
  workflow_dispatch:

jobs:
  nvda-live:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Installs a guidepup-compatible NVDA and the speech-capture add-on.
      - name: Set up screen reader automation
        uses: guidepup/setup-action

      - name: Install test dependencies
        working-directory: live-tests
        run: npm install

      - name: Install Playwright browser
        working-directory: live-tests
        run: npx playwright install chromium

      # Loads OUR add-on into the guidepup-managed NVDA. This is the one step to
      # confirm on the first run (see install-addon.ps1 for the two options).
      - name: Install the Job Form Filler add-on into NVDA
        run: pwsh -File live-tests/install-addon.ps1

      - name: Run the live NVDA fill test
        working-directory: live-tests
        run: npx playwright test
