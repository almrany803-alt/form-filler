name: Profile create and delete (Windows, NVDA)

# Beta-tester stories for profiles as versions, driven by keyboard on real NVDA:
#   create: seed one version (English), add a second (Teaching) via New profile,
#           save; both must exist and the new one must be active.
#   delete: delete the active version, save; only the other must remain.

on:
  workflow_dispatch:
  push:

jobs:
  crud:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NVDA 2026.1.1
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.nvaccess.org/releases/2026.1.1/nvda_2026.1.1.exe" -OutFile nvda_setup.exe
          Start-Process -Wait -FilePath ".\nvda_setup.exe" -ArgumentList '--install-silent'
          Start-Sleep -Seconds 5
          Start-Process -Wait -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList '-q'
          Start-Sleep -Seconds 3

      - name: Load add-on, bind the dialog key, seed English
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          New-Item -ItemType Directory -Force -Path "$cfg\scratchpad\globalPlugins" | Out-Null
          Copy-Item -Recurse -Force "addon\globalPlugins\jobFormFiller" "$cfg\scratchpad\globalPlugins\"
          Set-Content -Path "$cfg\nvda.ini" -Value "[development]`r`n`tenableScratchpadDir = True`r`n"
          $f = "$cfg\scratchpad\globalPlugins\jobFormFiller\__init__.py"
          (Get-Content $f -Raw) -replace 'description=_\("Edit your saved details"\),', 'description=_("Edit your saved details"), gesture="kb:NVDA+shift+d",' | Set-Content $f
          $env:JFF_CFG = $cfg
          python betatest\profile_tool.py seed_english

      - name: Start NVDA
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          Start-Process -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList "-c `"$cfg`" -f `"$cfg\nvda.log`" -l 10 -m"
          Start-Sleep -Seconds 20

      - name: Create a second version and verify both exist
        shell: pwsh
        run: |
          pwsh -File betatest\drive_profiles.ps1 -Mode create
          $env:JFF_CFG = "$env:RUNNER_TEMP\nvdacfg"
          python betatest\profile_tool.py check_created

      - name: Delete the active version and verify only the other remains
        shell: pwsh
        run: |
          pwsh -File betatest\drive_profiles.ps1 -Mode delete
          $env:JFF_CFG = "$env:RUNNER_TEMP\nvdacfg"
          python betatest\profile_tool.py check_deleted

      - name: Upload the full NVDA log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-log-profile-crud
          path: ${{ runner.temp }}\nvdacfg\nvda.log
          if-no-files-found: warn
