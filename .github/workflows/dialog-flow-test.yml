name: Dialog flow (Windows, NVDA)

# One consolidated keyboard drive of the CURRENT dialog, five behaviours in
# sequence: personal details typed and saved, Cancel does not save, a section
# removed, an entry edited, a profile created then deleted. Judged by the store
# on disk (verify_dialog_flow.py) and by NVDA speech. Replaces the retired
# pre-0.9.58 dialog tests.

on:
  workflow_dispatch:
  push:

jobs:
  dialogflow:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NVDA 2026.1.1
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.nvaccess.org/releases/2026.1.1/nvda_2026.1.1.exe" -OutFile nvda_setup.exe
          Start-Process -Wait -FilePath ".\nvda_setup.exe" -ArgumentList '--install-silent'
          Start-Sleep -Seconds 5
          Start-Process -Wait -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList '-q'
          Start-Sleep -Seconds 3

      - name: Load add-on and seed sections
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          New-Item -ItemType Directory -Force -Path "$cfg\scratchpad\globalPlugins" | Out-Null
          Copy-Item -Recurse -Force "addon\globalPlugins\jobFormFiller" "$cfg\scratchpad\globalPlugins\"
          Set-Content -Path "$cfg\nvda.ini" -Value "[development]`r`n`tenableScratchpadDir = True`r`n"
          $env:JFF_CFG = $cfg
          python betatest\profile_tool.py seed_sections

      - name: Start NVDA (debug log)
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          Start-Process -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList "-c `"$cfg`" -f `"$cfg\nvda.log`" -l 10 -m"
          Start-Sleep -Seconds 20

      - name: Drive the current dialog flow
        shell: pwsh
        run: pwsh -File betatest\drive_dialog_flow.ps1
      - name: Check the store on disk
        shell: pwsh
        run: |
          $env:JFF_CFG = "$env:RUNNER_TEMP\nvdacfg"
          python betatest\verify_dialog_flow.py
      - name: Check by SPEECH
        if: always()
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          $spoken = ((Get-Content "$cfg\nvda.log" -Raw) -split "`n" | Select-String -Pattern "Speaking \[") -join " "
          $ok = $true
          foreach ($needle in @("Details saved", "Removed section", "Deleted")) {
            if ($spoken -match [regex]::Escape($needle)) { Write-Host "PASS  spoke: $needle" }
            else { Write-Host "FAIL  never spoke: $needle"; $ok = $false }
          }
          if (-not $ok) { exit 1 }
      - name: Upload the NVDA log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-log-dialog-flow
          path: ${{ runner.temp }}\nvdacfg\nvda.log
          if-no-files-found: warn
