name: Profile submenu (Windows, NVDA)

# Drives the Profile submenu from the NVDA+J menu (not the dialog): New profile,
# Delete profile. These menu paths were wired but not exercised in CI.

on:
  workflow_dispatch:
  push:

jobs:
  profilemenu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NVDA 2026.1.1
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.nvaccess.org/releases/2026.1.1/nvda_2026.1.1.exe" -OutFile nvda_setup.exe
          Start-Process -Wait -FilePath ".\nvda_setup.exe" -ArgumentList '--install-silent'
          Start-Sleep -Seconds 5
          Start-Process -Wait -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList '-q'
          Start-Sleep -Seconds 3

      - name: Load add-on and seed one profile (English)
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          New-Item -ItemType Directory -Force -Path "$cfg\scratchpad\globalPlugins" | Out-Null
          Copy-Item -Recurse -Force "addon\globalPlugins\jobFormFiller" "$cfg\scratchpad\globalPlugins\"
          Set-Content -Path "$cfg\nvda.ini" -Value "[development]`r`n`tenableScratchpadDir = True`r`n"
          $env:JFF_CFG = "$cfg"
          python betatest\profile_tool.py seed_english

      - name: Start NVDA
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          Start-Process -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList "-c `"$cfg`" -f `"$cfg\nvda.log`" -l 10 -m"
          Start-Sleep -Seconds 20

      - name: New profile via the Profile submenu
        shell: pwsh
        run: |
          pwsh -File betatest\drive_profile_menu.ps1 -Action new -Name "Teaching"
          $env:JFF_CFG = "$env:RUNNER_TEMP\nvdacfg"
          python betatest\profile_tool.py check_menu_new

      - name: Delete the active profile (Teaching) via the submenu
        shell: pwsh
        run: |
          # Teaching is active straight after New; Delete removes the active one
          # and re-points active to the remaining profile (English).
          pwsh -File betatest\drive_profile_menu.ps1 -Action del
          $env:JFF_CFG = "$env:RUNNER_TEMP\nvdacfg"
          python betatest\profile_tool.py check_menu_del

      - name: Upload the NVDA log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-log-profilemenu
          path: ${{ runner.temp }}\nvdacfg\nvda.log
          if-no-files-found: warn
