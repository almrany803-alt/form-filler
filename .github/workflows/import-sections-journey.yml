name: Import journey to sections (Windows, NVDA)

# Beta-tester Landmark tour: a first-time user with NO profile imports a real CV
# from the menu, through the file picker and dialogs, and lands in the sections
# manager. Judged by SPEECH: NVDA must actually read the seeded Experience
# entries back. This is the whole journey, not the internal function.

on:
  workflow_dispatch:
  push:

jobs:
  journey:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NVDA 2026.1.1
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.nvaccess.org/releases/2026.1.1/nvda_2026.1.1.exe" -OutFile nvda_setup.exe
          Start-Process -Wait -FilePath ".\nvda_setup.exe" -ArgumentList '--install-silent'
          Start-Sleep -Seconds 5
          Start-Process -Wait -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList '-q'
          Start-Sleep -Seconds 3

      - name: Make a real .docx CV from the text
        shell: pwsh
        run: |
          pip install python-docx
          python -c "import docx; d=docx.Document(); [d.add_paragraph(l) for l in open('betatest/beta_cv.txt', encoding='utf-8').read().splitlines()]; d.save('beta_cv.docx')"
          Write-Host "made beta_cv.docx"

      - name: Load add-on (NO profile - fresh first-time user)
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          New-Item -ItemType Directory -Force -Path "$cfg\scratchpad\globalPlugins" | Out-Null
          Copy-Item -Recurse -Force "addon\globalPlugins\jobFormFiller" "$cfg\scratchpad\globalPlugins\"
          Set-Content -Path "$cfg\nvda.ini" -Value "[development]`r`n`tenableScratchpadDir = True`r`n"

      - name: Start NVDA (debug log so speech is recorded)
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          Start-Process -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList "-c `"$cfg`" -f `"$cfg\nvda.log`" -l 10 -m"
          Start-Sleep -Seconds 20

      - name: Drive the import journey to the sections
        shell: pwsh
        run: pwsh -File betatest\drive_import_sections.ps1 -CvPath "$env:GITHUB_WORKSPACE\beta_cv.docx"

      - name: Check NVDA SPOKE the seeded Experience entries
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          $spoken = ((Get-Content "$cfg\nvda.log" -Raw) -split "`n" |
                     Select-String -Pattern "Speaking \[") -join " "
          $ok = $true
          foreach ($needle in @("Software Engineer", "Acme Corporation", "Junior Developer", "Globex")) {
            if ($spoken -match [regex]::Escape($needle)) { Write-Host "PASS  NVDA spoke: $needle" }
            else { Write-Host "FAIL  NVDA did NOT speak: $needle"; $ok = $false }
          }
          if (-not $ok) { exit 1 }

      - name: Upload the NVDA log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-log-import-journey
          path: ${{ runner.temp }}\nvdacfg\nvda.log
          if-no-files-found: warn
