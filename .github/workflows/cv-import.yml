name: CV import (Windows, NVDA)

# Beta-tester stories for CV import, end to end on real NVDA: open the dialog,
# press the Import button, pick a CV file, let it parse and populate the fields,
# save, and confirm the encrypted profile holds the details pulled from the CV.
# Run for an English CV and an Arabic CV.

on:
  workflow_dispatch:
  push:

jobs:
  cvimport:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NVDA 2026.1.1
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.nvaccess.org/releases/2026.1.1/nvda_2026.1.1.exe" -OutFile nvda_setup.exe
          Start-Process -Wait -FilePath ".\nvda_setup.exe" -ArgumentList '--install-silent'
          Start-Sleep -Seconds 5
          Start-Process -Wait -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList '-q'
          Start-Sleep -Seconds 3

      - name: Load add-on and bind the dialog key (no profile seeded)
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          New-Item -ItemType Directory -Force -Path "$cfg\scratchpad\globalPlugins" | Out-Null
          Copy-Item -Recurse -Force "addon\globalPlugins\jobFormFiller" "$cfg\scratchpad\globalPlugins\"
          Set-Content -Path "$cfg\nvda.ini" -Value "[development]`r`n`tenableScratchpadDir = True`r`n"
          $f = "$cfg\scratchpad\globalPlugins\jobFormFiller\__init__.py"
          (Get-Content $f -Raw) -replace 'description=_\("Edit your saved details"\),', 'description=_("Edit your saved details"), gesture="kb:NVDA+shift+d",' | Set-Content $f

      - name: Start NVDA
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          Start-Process -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList "-c `"$cfg`" -f `"$cfg\nvda.log`" -l 10 -m"
          Start-Sleep -Seconds 20

      - name: Import an English CV and verify
        shell: pwsh
        run: |
          $cv = (Resolve-Path "betatest\sample_cv_en.txt").Path
          pwsh -File betatest\drive_cv.ps1 -CvPath "$cv"
          $env:JFF_CFG = "$env:RUNNER_TEMP\nvdacfg"
          python betatest\profile_tool.py check cv_en

      - name: Import an Arabic CV and verify
        shell: pwsh
        run: |
          $cv = (Resolve-Path "betatest\sample_cv_ar.txt").Path
          pwsh -File betatest\drive_cv.ps1 -CvPath "$cv"
          $env:JFF_CFG = "$env:RUNNER_TEMP\nvdacfg"
          python betatest\profile_tool.py check cv_ar

      - name: Upload the full NVDA log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-log-cv
          path: ${{ runner.temp }}\nvdacfg\nvda.log
          if-no-files-found: warn
