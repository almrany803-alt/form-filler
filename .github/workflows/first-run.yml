name: First run (no profile) - empty-state + menu import

# The clean-state journey I was NOT testing: a brand-new user with nothing saved.
#  - empty-state: trigger a fill; the "no details saved" message must be SPOKEN
#    (asserted against the NVDA log), not cancelled.
#  - menu import: use the menu's Import from CV, which must create and SAVE a
#    named profile (the path that was silently not persisting).

on:
  workflow_dispatch:
  push:

jobs:
  firstrun:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Install NVDA 2026.1.1
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.nvaccess.org/releases/2026.1.1/nvda_2026.1.1.exe" -OutFile nvda_setup.exe
          Start-Process -Wait -FilePath ".\nvda_setup.exe" -ArgumentList '--install-silent'
          Start-Sleep -Seconds 5
          Start-Process -Wait -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList '-q'
          Start-Sleep -Seconds 3

      - name: Load add-on (NO profile seeded)
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          New-Item -ItemType Directory -Force -Path "$cfg\scratchpad\globalPlugins" | Out-Null
          Copy-Item -Recurse -Force "addon\globalPlugins\jobFormFiller" "$cfg\scratchpad\globalPlugins\"
          Set-Content -Path "$cfg\nvda.ini" -Value "[development]`r`n`tenableScratchpadDir = True`r`n"

      - name: Start NVDA
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          Start-Process -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList "-c `"$cfg`" -f `"$cfg\nvda.log`" -l 10 -m"
          Start-Sleep -Seconds 20

      - name: Empty-state - the message must be SPOKEN
        working-directory: betatest
        shell: pwsh
        run: |
          npm install | Out-Null
          npx playwright install chromium | Out-Null
          node firstrun_empty.mjs
          $log = "$env:RUNNER_TEMP\nvdacfg\nvda.log"
          $spoke = Select-String -Path $log -Pattern "No details saved yet" -SimpleMatch
          if ($spoke) { Write-Host "PASS empty-state message was spoken:"; $spoke | Select-Object -First 1 }
          else { Write-Host "FAIL empty-state message was NOT spoken"; exit 1 }

      - name: Menu import - must create and SAVE a named profile
        shell: pwsh
        run: |
          $cv = (Resolve-Path "betatest\cvs\cv_en.docx").Path
          pwsh -File betatest\drive_import_menu.ps1 -CvPath "$cv"
          $env:JFF_CFG = "$env:RUNNER_TEMP\nvdacfg"
          python betatest\profile_tool.py check_import_menu

      - name: Upload the NVDA log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-log-firstrun
          path: ${{ runner.temp }}\nvdacfg\nvda.log
          if-no-files-found: warn
