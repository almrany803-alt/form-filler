name: Dialog 0958 changes (Windows, NVDA)

# Live check of the 0.9.58 changes by SPEECH: Enter opens a section (no Open
# button), Add section asks a Type (combo box), and a Work-typed section's new
# entry shows Work fields (Job title, Start date).

on:
  workflow_dispatch:
  push:

jobs:
  dialog0958:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NVDA 2026.1.1
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.nvaccess.org/releases/2026.1.1/nvda_2026.1.1.exe" -OutFile nvda_setup.exe
          Start-Process -Wait -FilePath ".\nvda_setup.exe" -ArgumentList '--install-silent'
          Start-Sleep -Seconds 5
          Start-Process -Wait -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList '-q'
          Start-Sleep -Seconds 3

      - name: Load add-on and seed sections
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          New-Item -ItemType Directory -Force -Path "$cfg\scratchpad\globalPlugins" | Out-Null
          Copy-Item -Recurse -Force "addon\globalPlugins\jobFormFiller" "$cfg\scratchpad\globalPlugins\"
          Set-Content -Path "$cfg\nvda.ini" -Value "[development]`r`n`tenableScratchpadDir = True`r`n"
          $env:JFF_CFG = $cfg
          python betatest\profile_tool.py seed_sections

      - name: Start NVDA (debug log)
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          Start-Process -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList "-c `"$cfg`" -f `"$cfg\nvda.log`" -l 10 -m"
          Start-Sleep -Seconds 20

      - name: Drive the 0.9.58 flow
        shell: pwsh
        run: pwsh -File betatest\drive_0958.ps1

      - name: Check the 0.9.58 changes by SPEECH
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          $lines = (Get-Content "$cfg\nvda.log" -Raw) -split "`n" | Select-String -Pattern "Speaking \["
          $spoken = ($lines -join " ")
          $ok = $true
          # Enter opened Education (an Education entry was spoken)
          if ($spoken -match "University of the West of England") { Write-Host "PASS  Enter opened a section" }
          else { Write-Host "FAIL  Enter did not open a section"; $ok = $false }
          # Add section offered a Type combo box
          $typeCombo = $lines | Where-Object { ($_ -match "Type") -and ($_ -match "combo box") }
          if ($typeCombo) { Write-Host "PASS  Add section asks a Type" }
          else { Write-Host "FAIL  no Type combo box on Add section"; $ok = $false }
          # a Work section's entry form shows Work fields
          foreach ($needle in @("Job title", "Start date")) {
            if ($spoken -match [regex]::Escape($needle)) { Write-Host "PASS  Work entry shows: $needle" }
            else { Write-Host "FAIL  Work entry missing: $needle"; $ok = $false }
          }
          if (-not $ok) { exit 1 }

      - name: Upload the NVDA log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-log-dialog0958
          path: ${{ runner.temp }}\nvdacfg\nvda.log
          if-no-files-found: warn
