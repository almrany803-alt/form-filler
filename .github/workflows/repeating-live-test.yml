name: Repeating blocks LIVE (Windows, NVDA, Chrome)

# Scan several REAL, LIVE Greenhouse application forms for a repeating section
# and exercise the repeating fill on the first one found. Judged by real field
# values and the NVDA speech log. Honest skip if none have one right now.

on:
  workflow_dispatch:
  push:

jobs:
  repeatinglive:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright Chrome
        shell: pwsh
        run: |
          npm i -D playwright@1.47.2 | Out-Null
          npx playwright install chrome | Out-Null
      - name: Install NVDA 2026.1.1
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.nvaccess.org/releases/2026.1.1/nvda_2026.1.1.exe" -OutFile nvda_setup.exe
          Start-Process -Wait -FilePath ".\nvda_setup.exe" -ArgumentList '--install-silent'
          Start-Sleep -Seconds 5
          Start-Process -Wait -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList '-q'
          Start-Sleep -Seconds 3
      - name: Load add-on and seed Work + Education
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          New-Item -ItemType Directory -Force -Path "$cfg\scratchpad\globalPlugins" | Out-Null
          Copy-Item -Recurse -Force "addon\globalPlugins\jobFormFiller" "$cfg\scratchpad\globalPlugins\"
          Set-Content -Path "$cfg\nvda.ini" -Value "[development]`r`n`tenableScratchpadDir = True`r`n"
          $env:JFF_CFG = "$cfg"
          python live-tests\seed_repeating_live.py
      - name: Start NVDA
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          Start-Process -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList "-c `"$cfg`" -f `"$cfg\nvda.log`" -l 10 -m"
          Start-Sleep -Seconds 20
      - name: Scan live forms and fill a repeating section
        shell: pwsh
        run: |
          cd betatest
          node fill_repeating_live.mjs
      - name: Upload the NVDA log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-log-repeating-live
          path: ${{ runner.temp }}\nvdacfg\nvda.log
          if-no-files-found: warn
