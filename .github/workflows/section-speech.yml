name: Sections spoken (Windows, NVDA)

# Proves the CV-seeded sections are real and readable on REAL NVDA: seed a
# profile's sections from a CV, open "My sections", drill into Experience, and
# check that NVDA actually SPEAKS the entry summaries (not just that the data is
# in the store). This is the "listen to what NVDA says" check.

on:
  workflow_dispatch:
  push:

jobs:
  sections:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NVDA 2026.1.1
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.nvaccess.org/releases/2026.1.1/nvda_2026.1.1.exe" -OutFile nvda_setup.exe
          Start-Process -Wait -FilePath ".\nvda_setup.exe" -ArgumentList '--install-silent'
          Start-Sleep -Seconds 5
          Start-Process -Wait -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList '-q'
          Start-Sleep -Seconds 3

      - name: Load add-on and seed a profile WITH CV sections
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          New-Item -ItemType Directory -Force -Path "$cfg\scratchpad\globalPlugins" | Out-Null
          Copy-Item -Recurse -Force "addon\globalPlugins\jobFormFiller" "$cfg\scratchpad\globalPlugins\"
          Set-Content -Path "$cfg\nvda.ini" -Value "[development]`r`n`tenableScratchpadDir = True`r`n"
          $env:JFF_CFG = $cfg
          python betatest\profile_tool.py seed_sections

      - name: Start NVDA (debug log so speech is recorded)
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          Start-Process -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList "-c `"$cfg`" -f `"$cfg\nvda.log`" -l 10 -m"
          Start-Sleep -Seconds 20

      - name: Drive the sections manager and read Experience entries
        shell: pwsh
        run: pwsh -File betatest\drive_sections.ps1

      - name: Check NVDA actually SPOKE the entry summaries
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          $log = Get-Content "$cfg\nvda.log" -Raw
          # Pull only the lines NVDA spoke.
          $spoken = ($log -split "`n" | Select-String -Pattern "Speaking \[") -join " "
          Write-Host "=== spoken phrases containing 'Volunteer'/'Mentor'/'Sight'/'Look' ==="
          ($log -split "`n" | Select-String -Pattern "Speaking \[" |
             Select-String -Pattern "Volunteer|Mentor|Sight Support|Look UK") |
             ForEach-Object { Write-Host $_.Line }
          $ok = $true
          foreach ($needle in @("Technology Support Volunteer", "Sight Support West of England", "Peer Mentor", "Look UK")) {
            if ($spoken -match [regex]::Escape($needle)) {
              Write-Host "PASS  NVDA spoke: $needle"
            } else {
              Write-Host "FAIL  NVDA did NOT speak: $needle"
              $ok = $false
            }
          }
          if (-not $ok) { exit 1 }

      - name: Upload the NVDA log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-log-section-speech
          path: ${{ runner.temp }}\nvdacfg\nvda.log
          if-no-files-found: warn
