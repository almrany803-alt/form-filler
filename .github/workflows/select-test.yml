name: Select fill (Windows, NVDA, Chrome)

# Native <select> dropdown filling, single field. Iterating here in isolation so
# the main beta-fill suite stays green while the choice path is proven.

on:
  workflow_dispatch:
  push:

jobs:
  selectfill:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chrome
        shell: pwsh
        run: |
          npm i -D playwright@1.47.2 | Out-Null
          npx playwright install chrome | Out-Null

      - name: Install NVDA 2026.1.1
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.nvaccess.org/releases/2026.1.1/nvda_2026.1.1.exe" -OutFile nvda_setup.exe
          Start-Process -Wait -FilePath ".\nvda_setup.exe" -ArgumentList '--install-silent'
          Start-Sleep -Seconds 5
          Start-Process -Wait -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList '-q'
          Start-Sleep -Seconds 3

      - name: Load add-on and seed the profile (country = United Kingdom)
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          New-Item -ItemType Directory -Force -Path "$cfg\scratchpad\globalPlugins" | Out-Null
          Copy-Item -Recurse -Force "addon\globalPlugins\jobFormFiller" "$cfg\scratchpad\globalPlugins\"
          Set-Content -Path "$cfg\nvda.ini" -Value "[development]`r`n`tenableScratchpadDir = True`r`n"
          $env:JFF_CFG = "$cfg"
          python live-tests\seed_profile.py

      - name: Start NVDA
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          Start-Process -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList "-c `"$cfg`" -f `"$cfg\nvda.log`" -l 10 -m"
          Start-Sleep -Seconds 20

      - name: Fill the native select (single field: exact, locale, decline)
        shell: pwsh
        run: |
          cd betatest
          node fill_select.mjs

      - name: Whole-form fill over text + select
        shell: pwsh
        run: |
          cd betatest
          node fill_select_form.mjs

      - name: Upload the NVDA log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-log-select
          path: ${{ runner.temp }}\nvdacfg\nvda.log
          if-no-files-found: warn
