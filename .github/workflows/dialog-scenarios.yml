name: Dialog scenarios (Windows, NVDA)

# Beta-tester "stories" for the My details dialog, driven by keyboard on real
# NVDA and verified against the encrypted profile:
#   cancel  (Rained-Out tour): change a field then Escape; profile must NOT change.
#   edit    (Prior-version):   reopen, change a field, save; the change persists.
#   unicode (FedEx tour):      paste Arabic + apostrophe/CJK, save; round-trips intact.

on:
  workflow_dispatch:
  push:

jobs:
  scenarios:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NVDA 2026.1.1
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.nvaccess.org/releases/2026.1.1/nvda_2026.1.1.exe" -OutFile nvda_setup.exe
          Start-Process -Wait -FilePath ".\nvda_setup.exe" -ArgumentList '--install-silent'
          Start-Sleep -Seconds 5
          Start-Process -Wait -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList '-q'
          Start-Sleep -Seconds 3

      - name: Load add-on, bind the dialog key, seed a BASELINE profile
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          New-Item -ItemType Directory -Force -Path "$cfg\scratchpad\globalPlugins" | Out-Null
          Copy-Item -Recurse -Force "addon\globalPlugins\jobFormFiller" "$cfg\scratchpad\globalPlugins\"
          Set-Content -Path "$cfg\nvda.ini" -Value "[development]`r`n`tenableScratchpadDir = True`r`n"
          $f = "$cfg\scratchpad\globalPlugins\jobFormFiller\__init__.py"
          (Get-Content $f -Raw) -replace 'description=_\("Edit your saved details"\),', 'description=_("Edit your saved details"), gesture="kb:NVDA+shift+d",' | Set-Content $f
          $env:JFF_CFG = $cfg
          python betatest\profile_tool.py seed

      - name: Start NVDA
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          Start-Process -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList "-c `"$cfg`" -f `"$cfg\nvda.log`" -l 10 -m"
          Start-Sleep -Seconds 20

      - name: Story - cancel must not save
        shell: pwsh
        run: |
          pwsh -File betatest\dialog_action.ps1 -Mode cancel
          $env:JFF_CFG = "$env:RUNNER_TEMP\nvdacfg"
          python betatest\profile_tool.py check cancel

      - name: Story - edit persists
        shell: pwsh
        run: |
          pwsh -File betatest\dialog_action.ps1 -Mode edit
          $env:JFF_CFG = "$env:RUNNER_TEMP\nvdacfg"
          python betatest\profile_tool.py check edit

      - name: Story - Arabic and CJK round-trip
        shell: pwsh
        run: |
          pwsh -File betatest\dialog_action.ps1 -Mode unicode
          $env:JFF_CFG = "$env:RUNNER_TEMP\nvdacfg"
          python betatest\profile_tool.py check unicode

      - name: Upload the full NVDA log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-log-scenarios
          path: ${{ runner.temp }}\nvdacfg\nvda.log
          if-no-files-found: warn
