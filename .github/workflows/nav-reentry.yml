name: Nav re-entry (pywinauto, fixed vs buggy)

# The honest test: a navigation checker only proves anything if it FAILS on the
# build that actually had the bug. So we run the same pywinauto test twice:
#   fixed  -> current dialogs, the list must stay reachable after open+close.
#   buggy  -> the 0.9.53 dialogs (before the focus fix), the test MUST catch the
#             re-entry bug. If it doesn't, the test is toothless and this job fails.
# pywinauto reads the real UI Automation tree, so we assert reachability as a
# property of the tree, not by counting Tab presses.

# This was the one-time proof that the pywinauto navigation check has teeth: it
# caught the re-entry bug on 0.9.53 and passed on the fixed build. Menu and
# routing have since changed (My sections removed, Edit profile now opens the
# list), so the buggy 0.9.53 variant is no longer reachable the same way.
# Ongoing re-entry protection lives in the CRUD machine's focus invariant on the
# current build; this stays runnable on demand as the historical proof.
on:
  workflow_dispatch:

jobs:
  nav:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [fixed, buggy]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use the 0.9.53 (pre-fix) dialogs for the buggy variant
        if: matrix.variant == 'buggy'
        shell: pwsh
        run: |
          git checkout e1857e7 -- addon/globalPlugins/jobFormFiller/dialogs.py
          Write-Host "checked out 0.9.53 dialogs.py (no re-entry focus fix)"

      - name: Install NVDA 2026.1.1
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.nvaccess.org/releases/2026.1.1/nvda_2026.1.1.exe" -OutFile nvda_setup.exe
          Start-Process -Wait -FilePath ".\nvda_setup.exe" -ArgumentList '--install-silent'
          Start-Sleep -Seconds 5
          Start-Process -Wait -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList '-q'
          Start-Sleep -Seconds 3

      - name: Install pywinauto
        shell: pwsh
        run: pip install pywinauto

      - name: Load add-on and seed sections
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          New-Item -ItemType Directory -Force -Path "$cfg\scratchpad\globalPlugins" | Out-Null
          Copy-Item -Recurse -Force "addon\globalPlugins\jobFormFiller" "$cfg\scratchpad\globalPlugins\"
          Set-Content -Path "$cfg\nvda.ini" -Value "[development]`r`n`tenableScratchpadDir = True`r`n"
          $env:JFF_CFG = $cfg
          python betatest\profile_tool.py seed_sections

      - name: Start NVDA
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          Start-Process -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList "-c `"$cfg`" -f `"$cfg\nvda.log`" -l 10 -m"
          Start-Sleep -Seconds 20

      - name: Open the sections dialog
        shell: pwsh
        run: pwsh -File betatest\drive_open_sections.ps1

      - name: Run the pywinauto navigation test and judge by variant
        shell: pwsh
        run: |
          python betatest\nav_pywinauto.py
          $code = $LASTEXITCODE
          Write-Host "nav test exit code: $code"
          if ("${{ matrix.variant }}" -eq "buggy") {
            if ($code -eq 1) { Write-Host "PASS: the test CAUGHT the re-entry bug on 0.9.53"; exit 0 }
            else { Write-Host "FAIL: the test did NOT catch the known 0.9.53 bug (toothless)"; exit 1 }
          } else {
            if ($code -eq 0) { Write-Host "PASS: no re-entry bug on the fixed build"; exit 0 }
            else { Write-Host "FAIL: re-entry regression on the fixed build"; exit 1 }
          }

      - name: Upload the NVDA log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-log-nav-${{ matrix.variant }}
          path: ${{ runner.temp }}\nvdacfg\nvda.log
          if-no-files-found: warn
