name: Navigation machine (Windows, pywinauto + Hypothesis)

# The heavy test layer, targeting the focus / re-entry bug on the REAL dialog.
# Hypothesis generates open / close / add sequences, pywinauto drives the real
# SectionsDialog through the accessibility API, and the invariant checks the
# Sections list keeps keyboard focus whenever we return to the top.
# Proof it has teeth: it must PASS on the fixed dialogs and CATCH the bug in a
# copy with the re-entry focus fix stripped out.

on:
  workflow_dispatch:
  push:

jobs:
  navmachine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install wxPython, pywinauto, Hypothesis
        shell: pwsh
        run: pip install wxpython pywinauto hypothesis python-docx

      - name: Sanity check the harness imports the real dialogs
        shell: pwsh
        run: |
          python -c "import sys; sys.argv=['h','addon/globalPlugins/jobFormFiller']; import importlib.util, os; print('harness present:', os.path.exists('betatest/dialog_harness.py'))"

      - name: Machine vs the FIXED dialogs (must find no bug)
        shell: pwsh
        run: |
          python betatest/nav_machine.py addon/globalPlugins/jobFormFiller
          if ($LASTEXITCODE -ne 0) { Write-Host "FAIL: machine reported a bug in the fixed build"; exit 1 }
          Write-Host "PASS: fixed build, list keeps focus on every re-entry"

      - name: Make a buggy copy (strip the re-entry focus fix)
        shell: pwsh
        run: python betatest/make_buggy.py addon/globalPlugins/jobFormFiller buggy/globalPlugins/jobFormFiller

      - name: Machine vs the BUGGY dialogs (must CATCH the bug)
        shell: pwsh
        run: |
          python betatest/nav_machine.py buggy/globalPlugins/jobFormFiller
          if ($LASTEXITCODE -eq 0) { Write-Host "FAIL: machine did NOT catch the known re-entry bug"; exit 1 }
          Write-Host "PASS: machine caught the re-entry bug in the buggy build"
