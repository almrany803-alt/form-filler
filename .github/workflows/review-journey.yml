name: Review journey (Windows, NVDA, Chrome)

# The single end-to-end review journey, as the methodical navigator: open the
# review list on a form with every control kind and change one of each through
# its own accessible editor, then confirm the change landed. Isolated here so
# the main beta-fill suite stays green while the kind-aware review editor is
# proven. NVDA runs at -l 10 (debug), so the log carries the speech and can be
# read to confirm each editor announced.

on:
  workflow_dispatch:
  push:

jobs:
  reviewjourney:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chrome
        shell: pwsh
        run: |
          npm i -D playwright@1.47.2 | Out-Null
          npx playwright install chrome | Out-Null

      - name: Install NVDA 2026.1.1
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.nvaccess.org/releases/2026.1.1/nvda_2026.1.1.exe" -OutFile nvda_setup.exe
          Start-Process -Wait -FilePath ".\nvda_setup.exe" -ArgumentList '--install-silent'
          Start-Sleep -Seconds 5
          Start-Process -Wait -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList '-q'
          Start-Sleep -Seconds 3

      - name: Load add-on and seed the profile
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          New-Item -ItemType Directory -Force -Path "$cfg\scratchpad\globalPlugins" | Out-Null
          Copy-Item -Recurse -Force "addon\globalPlugins\jobFormFiller" "$cfg\scratchpad\globalPlugins\"
          Set-Content -Path "$cfg\nvda.ini" -Value "[development]`r`n`tenableScratchpadDir = True`r`n"
          $env:JFF_CFG = "$cfg"
          python live-tests\seed_profile.py

      - name: Start NVDA (debug log level)
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          Start-Process -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList "-c `"$cfg`" -f `"$cfg\nvda.log`" -l 10 -m"
          Start-Sleep -Seconds 20

      - name: Review journey (text, chooser, yes/no editors)
        shell: pwsh
        run: |
          cd betatest
          node fill_review_journey.mjs

      - name: Upload the NVDA debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-log-review-journey
          path: ${{ runner.temp }}\nvdacfg\nvda.log
          if-no-files-found: warn
