name: Edit profile opens the list (Windows, NVDA)

# The regression test for the REAL bug, on the path the user takes: reach the
# profile through Edit profile (Profile submenu), not My sections. It must open
# the SECTIONS LIST, not the standalone first-name/last-name form. Judged by
# SPEECH: NVDA must speak the Sections list, reach an Education entry from this
# entry point, and announce the Import from CV button.

on:
  workflow_dispatch:
  push:

jobs:
  editprofile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NVDA 2026.1.1
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.nvaccess.org/releases/2026.1.1/nvda_2026.1.1.exe" -OutFile nvda_setup.exe
          Start-Process -Wait -FilePath ".\nvda_setup.exe" -ArgumentList '--install-silent'
          Start-Sleep -Seconds 5
          Start-Process -Wait -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList '-q'
          Start-Sleep -Seconds 3

      - name: Load add-on and seed a profile with sections
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          New-Item -ItemType Directory -Force -Path "$cfg\scratchpad\globalPlugins" | Out-Null
          Copy-Item -Recurse -Force "addon\globalPlugins\jobFormFiller" "$cfg\scratchpad\globalPlugins\"
          Set-Content -Path "$cfg\nvda.ini" -Value "[development]`r`n`tenableScratchpadDir = True`r`n"
          $env:JFF_CFG = $cfg
          python betatest\profile_tool.py seed_sections

      - name: Start NVDA (debug log so speech is recorded)
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          Start-Process -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList "-c `"$cfg`" -f `"$cfg\nvda.log`" -l 10 -m"
          Start-Sleep -Seconds 20

      - name: Drive Edit profile to the list
        shell: pwsh
        run: pwsh -File betatest\drive_edit_profile.ps1

      - name: Check by SPEECH that Edit profile opened the list, not the form
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          $lines = (Get-Content "$cfg\nvda.log" -Raw) -split "`n" | Select-String -Pattern "Speaking \["
          $spoken = ($lines -join " ")
          $ok = $true
          foreach ($needle in @("Personal information", "University of the West of England", "Import from CV")) {
            if ($spoken -match [regex]::Escape($needle)) { Write-Host "PASS  NVDA spoke: $needle" }
            else { Write-Host "FAIL  NVDA did NOT speak: $needle"; $ok = $false }
          }
          # the list control itself (proves it is the sections list, not the form)
          $list = $lines | Where-Object { $_ -match "Sections:" }
          if ($list) { Write-Host "PASS  opened the Sections list from Edit profile" }
          else { Write-Host "FAIL  did not open the Sections list from Edit profile"; $ok = $false }
          if (-not $ok) { exit 1 }

      - name: Upload the NVDA log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-log-edit-profile
          path: ${{ runner.temp }}\nvdacfg\nvda.log
          if-no-files-found: warn
