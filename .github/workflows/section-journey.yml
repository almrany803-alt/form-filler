name: Section journey re-entry (Windows, NVDA)

# The applicant journey that exposes the re-entry bug, judged by SPEECH:
#   - open Education, close it, then REACH Experience (was impossible: you got
#     stuck on the buttons). Proven by NVDA speaking an Experience entry.
#   - open an entry and confirm the date field is now the PICKER (a button),
#     not a free-text box: a spoken line has "Start date" and "button".
#   - reach Skills, re-open Education AGAIN, and add then remove a section.

on:
  workflow_dispatch:
  push:

jobs:
  journey:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NVDA 2026.1.1
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.nvaccess.org/releases/2026.1.1/nvda_2026.1.1.exe" -OutFile nvda_setup.exe
          Start-Process -Wait -FilePath ".\nvda_setup.exe" -ArgumentList '--install-silent'
          Start-Sleep -Seconds 5
          Start-Process -Wait -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList '-q'
          Start-Sleep -Seconds 3

      - name: Load add-on and seed sections
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          New-Item -ItemType Directory -Force -Path "$cfg\scratchpad\globalPlugins" | Out-Null
          Copy-Item -Recurse -Force "addon\globalPlugins\jobFormFiller" "$cfg\scratchpad\globalPlugins\"
          Set-Content -Path "$cfg\nvda.ini" -Value "[development]`r`n`tenableScratchpadDir = True`r`n"
          $env:JFF_CFG = $cfg
          python betatest\profile_tool.py seed_sections

      - name: Start NVDA (debug log so speech is recorded)
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          Start-Process -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList "-c `"$cfg`" -f `"$cfg\nvda.log`" -l 10 -m"
          Start-Sleep -Seconds 20

      - name: Drive the full journey
        shell: pwsh
        run: pwsh -File betatest\drive_section_journey.ps1

      - name: Check the re-entry, the picker, and section add/remove by SPEECH
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          $lines = (Get-Content "$cfg\nvda.log" -Raw) -split "`n" | Select-String -Pattern "Speaking \["
          $spoken = ($lines -join " ")
          $ok = $true
          # re-entry: reaching Experience and Skills AFTER Education is the fix
          foreach ($needle in @("Technology Support Volunteer", "Accessible Learning Design",
                                "Added section Certifications", "Removed section Certifications")) {
            if ($spoken -match [regex]::Escape($needle)) { Write-Host "PASS  NVDA spoke: $needle" }
            else { Write-Host "FAIL  NVDA did NOT speak: $needle"; $ok = $false }
          }
          # date picker: the Start date field is now a button (not an edit box)
          $picker = $lines | Where-Object { ($_ -match "Start date") -and ($_ -match "button") }
          if ($picker) { Write-Host "PASS  Start date is a picker button:"; Write-Host $picker[0].Line }
          else { Write-Host "FAIL  Start date is not a button (date picker missing)"; $ok = $false }
          if (-not $ok) { exit 1 }

      - name: Upload the NVDA log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-log-section-journey
          path: ${{ runner.temp }}\nvdacfg\nvda.log
          if-no-files-found: warn
