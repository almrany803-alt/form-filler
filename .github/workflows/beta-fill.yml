name: Beta fill test (Chrome + NVDA)

# The human-beta-tester test: open the form in real Chrome on a real Windows
# machine, press the add-on's "fill whole form" key, and check what actually
# landed in the boxes. NVDA 2026.1.1, the same one you run.

on:
  workflow_dispatch:
  push:

jobs:
  betafill:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Download and install NVDA 2026.1.1
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.nvaccess.org/releases/2026.1.1/nvda_2026.1.1.exe" -OutFile nvda_setup.exe
          Start-Process -Wait -FilePath ".\nvda_setup.exe" -ArgumentList '--install-silent'
          Start-Sleep -Seconds 5
          Start-Process -Wait -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList '-q'
          Start-Sleep -Seconds 3

      - name: Seed a profile (encrypted with DPAPI, as the runner user)
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          New-Item -ItemType Directory -Force -Path "$cfg\jobFormFiller" | Out-Null
          $env:JFF_CFG = $cfg
          python live-tests/seed_profile.py

      - name: Load the add-on via the scratchpad
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          New-Item -ItemType Directory -Force -Path "$cfg\scratchpad\globalPlugins" | Out-Null
          Copy-Item -Recurse -Force "addon\globalPlugins\jobFormFiller" "$cfg\scratchpad\globalPlugins\"
          Set-Content -Path "$cfg\nvda.ini" -Value "[development]`r`n`tenableScratchpadDir = True`r`n"

      - name: Start NVDA (logging to file)
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          Start-Process -FilePath "C:\Program Files\NVDA\nvda.exe" `
            -ArgumentList "-c `"$cfg`" -f `"$cfg\nvda.log`" -l 10 -m"
          Start-Sleep -Seconds 20

      - name: Install Playwright + run the beta fill test
        working-directory: betatest
        shell: pwsh
        run: |
          npm install | Out-Null
          npx playwright install chromium | Out-Null
          node fill_test.mjs
          Write-Host "----- now the messy stress test -----"
          node fill_messy.mjs

      - name: Dump the add-on's log lines (always)
        if: always()
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\nvdacfg\nvda.log"
          if (Test-Path $log) {
            Write-Host "===== JFF lines from the real NVDA log ====="
            Get-Content $log | Select-String -Pattern "JFF|jobFormFiller"
          } else { Write-Host "no NVDA log found" }
