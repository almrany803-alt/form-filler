name: Beta fill test (Chrome + NVDA)

# The human-beta-tester test: open the form in real Chrome on a real Windows
# machine, press the add-on's "fill whole form" key, and check what actually
# landed in the boxes. NVDA 2026.1.1, the same one you run.

on:
  workflow_dispatch:
  push:

jobs:
  betafill:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Download and install NVDA 2026.1.1
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.nvaccess.org/releases/2026.1.1/nvda_2026.1.1.exe" -OutFile nvda_setup.exe
          Start-Process -Wait -FilePath ".\nvda_setup.exe" -ArgumentList '--install-silent'
          Start-Sleep -Seconds 5
          Start-Process -Wait -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList '-q'
          Start-Sleep -Seconds 3

      - name: Seed a profile (encrypted with DPAPI, as the runner user)
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          New-Item -ItemType Directory -Force -Path "$cfg\jobFormFiller" | Out-Null
          $env:JFF_CFG = $cfg
          python live-tests/seed_profile.py

      - name: Load the add-on via the scratchpad
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          New-Item -ItemType Directory -Force -Path "$cfg\scratchpad\globalPlugins" | Out-Null
          Copy-Item -Recurse -Force "addon\globalPlugins\jobFormFiller" "$cfg\scratchpad\globalPlugins\"
          Set-Content -Path "$cfg\nvda.ini" -Value "[development]`r`n`tenableScratchpadDir = True`r`n"

      - name: Start NVDA (logging to file)
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          Start-Process -FilePath "C:\Program Files\NVDA\nvda.exe" `
            -ArgumentList "-c `"$cfg`" -f `"$cfg\nvda.log`" -l 10 -m"
          Start-Sleep -Seconds 20

      - name: Install Playwright + run the beta fill tests
        working-directory: betatest
        shell: pwsh
        run: |
          npm install | Out-Null
          npx playwright install chromium | Out-Null
          $failed = $false
          Write-Host "===== warm-up (absorbs cold start) ====="
          node warmup.mjs
          Write-Host "===== clean form ====="
          node fill_test.mjs;    if ($LASTEXITCODE -ne 0) { $failed = $true }
          Write-Host "===== messy stress form ====="
          node fill_messy.mjs;   if ($LASTEXITCODE -ne 0) { $failed = $true }
          Write-Host "===== user journeys (tabbing + multi-section) ====="
          node fill_journey.mjs; if ($LASTEXITCODE -ne 0) { $failed = $true }
          Write-Host "===== abuse / survival ====="
          node fill_abuse.mjs;   if ($LASTEXITCODE -ne 0) { $failed = $true }
          Write-Host "===== international + inaccessible (French/German + ATS) ====="
          node fill_intl.mjs;    if ($LASTEXITCODE -ne 0) { $failed = $true }
          Write-Host "===== review list (open, list fields, fill one) ====="
          node fill_review.mjs;  if ($LASTEXITCODE -ne 0) { $failed = $true }
          Write-Host "===== review list Edit + Clear ====="
          node fill_review_actions.mjs; if ($LASTEXITCODE -ne 0) { $failed = $true }
          Write-Host "===== autocomplete-only fields (IA2 limitation: declined) ====="
          node fill_autocomplete.mjs; if ($LASTEXITCODE -ne 0) { $failed = $true }
          Write-Host "===== Greenhouse-style form (real ATS) ====="
          node fill_greenhouse.mjs; if ($LASTEXITCODE -ne 0) { $failed = $true }
          Write-Host "===== Taleo-style form (camelCase names) ====="
          node fill_taleo.mjs;   if ($LASTEXITCODE -ne 0) { $failed = $true }
          Write-Host "===== mangled parse: do not clobber a pre-filled value ====="
          node fill_mangled.mjs; if ($LASTEXITCODE -ne 0) { $failed = $true }
          if ($failed) { Write-Host "one or more beta tests failed"; exit 1 }

      - name: Fail if the add-on threw an uncaught error
        if: always()
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\nvdacfg\nvda.log"
          if (Test-Path $log) {
            $bad = Get-Content $log | Select-String -Pattern "error executing script" |
                   Select-String -Pattern "jobFormFiller"
            if ($bad) { Write-Host "Uncaught add-on error during abuse:"; $bad; exit 1 }
            Write-Host "No uncaught add-on errors."
          }

      - name: Upload the full NVDA log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-log
          path: ${{ runner.temp }}\nvdacfg\nvda.log
          if-no-files-found: warn
