name: NVDA load (Windows, real NVDA)

# Replaces the Wine smoke test. Installs the same NVDA you run (2026.1.1) on a
# real Windows machine, loads the add-on via NVDA's developer scratchpad, and
# fails if the add-on raises anything on load. This is the "does it load on
# current NVDA" check, done for real instead of under Wine.

on:
  workflow_dispatch:
  push:

jobs:
  load:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download NVDA 2026.1.1
        shell: pwsh
        run: Invoke-WebRequest "https://download.nvaccess.org/releases/2026.1.1/nvda_2026.1.1.exe" -OutFile nvda_setup.exe

      - name: Install NVDA silently
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath ".\nvda_setup.exe" -ArgumentList '--install-silent'
          Start-Sleep -Seconds 5
          # quit the copy the installer auto-starts
          Start-Process -Wait -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList '-q'
          Start-Sleep -Seconds 3

      - name: Load the add-on via the scratchpad
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          New-Item -ItemType Directory -Force -Path "$cfg\scratchpad\globalPlugins" | Out-Null
          Copy-Item -Recurse -Force "addon\globalPlugins\jobFormFiller" "$cfg\scratchpad\globalPlugins\"
          Set-Content -Path "$cfg\nvda.ini" -Value "[development]`r`n`tenableScratchpadDir = True`r`n"

      - name: Start NVDA, wait, stop, dump our log lines
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          $log = "$cfg\nvda.log"
          Start-Process -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList "-c `"$cfg`" -f `"$log`" -l 10 -m"
          Start-Sleep -Seconds 30
          Start-Process -Wait -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList '-q'
          Start-Sleep -Seconds 3
          Write-Host "===== add-on lines in the NVDA log ====="
          if (Test-Path $log) {
            Get-Content $log | Select-String -Pattern "jobFormFiller|JFF|Global plugin|Traceback|Error"
          } else { Write-Host "NO LOG WRITTEN at $log" }

      - name: Fail if the add-on errored on load
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\nvdacfg\nvda.log"
          if (-not (Test-Path $log)) { Write-Host "No log; cannot confirm load."; exit 1 }
          $bad = Get-Content $log | Select-String -Pattern "jobFormFiller" |
                 Select-String -Pattern "Traceback|Error"
          if ($bad) { Write-Host "Add-on errored on load:"; $bad; exit 1 }
          Write-Host "Add-on loaded cleanly on NVDA 2026.1.1."
