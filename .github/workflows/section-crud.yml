name: Section add and delete (Windows, NVDA)

# Beta-tester scenarios for the sections manager, judged by SPEECH first:
#   Guidebook (add):    Add a section "Awards"; NVDA confirms "Added section Awards".
#   Rained-Out (delete): open Experience (2 entries), Remove one, confirm; NVDA
#                        says "Removed. 1 entries." The store is checked after as
#                        a backstop (Awards present, Experience down to 1).

on:
  workflow_dispatch:
  push:

jobs:
  crud:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NVDA 2026.1.1
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.nvaccess.org/releases/2026.1.1/nvda_2026.1.1.exe" -OutFile nvda_setup.exe
          Start-Process -Wait -FilePath ".\nvda_setup.exe" -ArgumentList '--install-silent'
          Start-Sleep -Seconds 5
          Start-Process -Wait -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList '-q'
          Start-Sleep -Seconds 3

      - name: Load add-on and seed a profile WITH sections
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          New-Item -ItemType Directory -Force -Path "$cfg\scratchpad\globalPlugins" | Out-Null
          Copy-Item -Recurse -Force "addon\globalPlugins\jobFormFiller" "$cfg\scratchpad\globalPlugins\"
          Set-Content -Path "$cfg\nvda.ini" -Value "[development]`r`n`tenableScratchpadDir = True`r`n"
          $env:JFF_CFG = $cfg
          python betatest\profile_tool.py seed_sections

      - name: Start NVDA (debug log so speech is recorded)
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          Start-Process -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList "-c `"$cfg`" -f `"$cfg\nvda.log`" -l 10 -m"
          Start-Sleep -Seconds 20

      - name: Drive add-section and remove-entry
        shell: pwsh
        run: pwsh -File betatest\drive_section_crud.ps1

      - name: Check NVDA SPOKE the add and delete outcomes
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          $spoken = ((Get-Content "$cfg\nvda.log" -Raw) -split "`n" |
                     Select-String -Pattern "Speaking \[") -join " "
          $ok = $true
          foreach ($needle in @("Added section Awards", "Removed", "1 entries")) {
            if ($spoken -match [regex]::Escape($needle)) { Write-Host "PASS  NVDA spoke: $needle" }
            else { Write-Host "FAIL  NVDA did NOT speak: $needle"; $ok = $false }
          }
          if (-not $ok) { exit 1 }

      - name: Backstop - confirm the store actually changed
        shell: pwsh
        run: |
          $env:JFF_CFG = "$env:RUNNER_TEMP\nvdacfg"
          python betatest\profile_tool.py check_sections

      - name: Upload the NVDA log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-log-section-crud
          path: ${{ runner.temp }}\nvdacfg\nvda.log
          if-no-files-found: warn
