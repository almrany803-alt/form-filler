name: Platform live test (Windows, NVDA, Chrome)

# Drives NVDA "fill all" on a REAL, LIVE, PUBLIC Greenhouse application form (no
# account). Finds a currently-open job at runtime, fills with a DUMMY identity,
# reads what landed in the real inputs, and NEVER submits. This is the honest
# test: a real form the add-on has never seen, not a fixture I wrote.

on:
  workflow_dispatch:
  push:

jobs:
  live-apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright Chrome
        shell: pwsh
        run: |
          npm i -D playwright@1.47.2 | Out-Null
          npx playwright install chrome | Out-Null
      - name: Install NVDA 2026.1.1
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.nvaccess.org/releases/2026.1.1/nvda_2026.1.1.exe" -OutFile nvda_setup.exe
          Start-Process -Wait -FilePath ".\nvda_setup.exe" -ArgumentList '--install-silent'
          Start-Sleep -Seconds 5
          Start-Process -Wait -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList '-q'
          Start-Sleep -Seconds 3
      - name: Load add-on and seed a dummy profile
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          New-Item -ItemType Directory -Force -Path "$cfg\scratchpad\globalPlugins" | Out-Null
          Copy-Item -Recurse -Force "addon\globalPlugins\jobFormFiller" "$cfg\scratchpad\globalPlugins\"
          Set-Content -Path "$cfg\nvda.ini" -Value "[development]`r`n`tenableScratchpadDir = True`r`n"
          $env:JFF_CFG = "$cfg"
          python live-tests\seed_live.py
      - name: Start NVDA (debug log level)
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\nvdacfg"
          Start-Process -FilePath "C:\Program Files\NVDA\nvda.exe" -ArgumentList "-c `"$cfg`" -f `"$cfg\nvda.log`" -l 10 -m"
          Start-Sleep -Seconds 20
      - name: Fill a LIVE public application (no submit)
        shell: pwsh
        env:
          JFF_BOARD: monzo
        run: |
          cd betatest
          node platform_live.mjs
      - name: Upload the NVDA debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-log-platform
          path: ${{ runner.temp }}\nvdacfg\nvda.log
          if-no-files-found: warn
