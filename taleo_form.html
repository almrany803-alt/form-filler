<!doctype html><html><head><meta charset="utf-8"><title>Apply - Taleo style</title></head>
<body>
<h1>Candidate profile</h1>
<!-- Taleo/iCIMS: camelCase names, labels often not associated or missing.
     Identity carried by the html name only. -->
<p>First name<input id="firstName" name="firstName" type="text"></p>
<p>Last name<input id="lastName" name="lastName" type="text"></p>
<p>Email<input id="emailAddress" name="emailAddress" type="text"></p>
<p>Phone<input id="phoneNumber" name="phoneNumber" type="text"></p>
<!-- A truly bare field (no name, no label): must be declined -->
<p><input id="mystery" type="text"></p>
</body></html>
