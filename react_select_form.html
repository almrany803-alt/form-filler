<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>React-Select Country</title></head>
<body>
<h1>Application form</h1>
<p><label id="country-label">Country</label></p>
<div id="root" style="width:440px"></div>
<!-- data-committed holds react-select's ACTUAL selected value (its onChange),
     the ground truth the test reads, not what the add-on claims. -->
<div id="committed" data-committed="">committed: (none)</div>
<div id="err" style="color:red"></div>
<script type="module">
  window.onerror = (m) => { document.getElementById('err').textContent = 'ERR: ' + m; };
  import React, { useState, useEffect, createElement as e } from 'https://esm.sh/react@18';
  import { createRoot } from 'https://esm.sh/react-dom@18/client';
  import Select from 'https://esm.sh/react-select@5?deps=react@18,react-dom@18';
  const options = [
    {value:'gb', label:'United Kingdom'}, {value:'sa', label:'Saudi Arabia'},
    {value:'us', label:'United States'}, {value:'ca', label:'Canada'},
    {value:'au', label:'Australia'}, {value:'de', label:'Germany'},
    {value:'fr', label:'France'}
  ];
  function App(){
    const [val, setVal] = useState(null);
    useEffect(() => {
      const d = document.getElementById('committed');
      d.setAttribute('data-committed', val ? val.label : '');
      d.textContent = 'committed: ' + (val ? val.label : '(none)');
    }, [val]);
    return e(Select, { options, value: val, onChange: setVal,
      inputId: 'country', 'aria-labelledby': 'country-label', placeholder: 'Select...' });
  }
  createRoot(document.getElementById('root')).render(e(App));
</script>
</body></html>
