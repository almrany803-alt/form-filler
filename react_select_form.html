<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>React-Select Country</title></head>
<body>
<h1>Application form</h1>
<p><label id="country-label">Country</label></p>
<div id="root" style="width:440px"></div>
<!-- data-committed holds react-select's ACTUAL selected value (onChange), the
     ground truth the test reads, not what the add-on claims -->
<div id="committed" data-committed="">committed: (none)</div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/react-select@5/dist/react-select.min.js"></script>
<script>
  var options = [
    {value:'gb', label:'United Kingdom'},
    {value:'sa', label:'Saudi Arabia'},
    {value:'us', label:'United States'},
    {value:'ca', label:'Canada'},
    {value:'au', label:'Australia'},
    {value:'de', label:'Germany'},
    {value:'fr', label:'France'}
  ];
  var Select = (window.ReactSelect || window.Select).default;
  var e = React.createElement;
  function App(){
    var st = React.useState(null), val = st[0], setVal = st[1];
    React.useEffect(function(){
      var d = document.getElementById('committed');
      d.setAttribute('data-committed', val ? val.label : '');
      d.textContent = 'committed: ' + (val ? val.label : '(none)');
    }, [val]);
    return e(Select, { options: options, value: val, onChange: setVal,
      inputId: 'country', 'aria-labelledby': 'country-label',
      placeholder: 'Select...' });
  }
  ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body></html>
