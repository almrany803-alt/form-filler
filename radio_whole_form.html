<!doctype html><html><head><meta charset="utf-8"><title>Eligibility form</title></head>
<body>
<h1>Application</h1>
<form>
  <p><label for="fn">First name</label><input id="fn" name="given-name"></p>
  <p><label for="country">Country</label>
    <select id="country" name="country">
      <option value="">Choose...</option>
      <option>France</option><option>United Kingdom</option><option>United States</option>
    </select></p>
  <fieldset>
    <legend>Are you authorised to work in Saudi Arabia?</legend>
    <label><input type="radio" name="wa" value="yes" id="wa_yes"> Yes</label>
    <label><input type="radio" name="wa" value="no" id="wa_no"> No</label>
  </fieldset>
  <p><label><input type="checkbox" id="consent"> I am authorised to work in Saudi Arabia</label></p>
</form>
</body></html>
