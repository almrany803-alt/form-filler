<!doctype html><html><head><meta charset="utf-8"><title>Multi-select form</title></head>
<body>
<h1>Application</h1>
<form>
  <p><label for="nat">Nationality</label></p>
  <select id="nat" name="nationality" multiple size="4">
    <option>British</option>
    <option>Saudi</option>
    <option>American</option>
    <option>French</option>
  </select>
</form>
</body></html>
